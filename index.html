<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Morales Valdez</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">

  <!-- Fondo con imagen difuminada -->
  <div class="absolute inset-0 -z-10">
    <img src="https://i.redd.it/krgbvzt8pgrc1.jpeg" 
         alt="Fondo difuminado"
         class="w-full h-full object-cover blur-mg brightness-50">
  </div>

  <!-- Tarjeta principal -->
  <main class="text-center p-8 bg-gray-900/80 rounded-2xl shadow-2xl max-w-lg border border-gray-700">
    <h1 class="text-4xl font-extrabold text-blue-400 drop-shadow-md transition-transform duration-300 hover:scale-105">
      Hola soy Pedro Morales Valdez
    </h1>

    <h2 class="text-lg text-gray-300 mt-4 italic">
      Me gustan los <span class="text-purple-400 font-semibold">videojuegos</span> y el <span class="text-pink-400 font-semibold">anime</span>
    </h2>
  </main>

</body>
</html>
